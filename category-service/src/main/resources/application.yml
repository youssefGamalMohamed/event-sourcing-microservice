# ----- Spring Config ------
spring:
  application:
    name: category-service

  # --- SQL Database (Postgres) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/app-command-db
    username: appuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  # --- Jpa Config ---------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          create_namespaces: true
        default_schema: category_schema

  # --- Mongo DB Query DB --------
  data:
    mongodb:
      uri: mongodb://appuser:mypassword@localhost:27017/categoryQueryDB?authSource=admin
      host: localhost
      port: 27017
      database: categoryQueryDB
      username: appuser
      password: mypassword

    # --- Redis Caching  --------
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  # --- Kafka Configuration ---
  kafka:
    bootstrap-servers: "localhost:9092"

    properties:
      schema.registry.url: "http://localhost:8081"

    producer:
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      value-serializer: "io.confluent.kafka.serializers.KafkaAvroSerializer"
      retries: 1  # ✅ CHANGED FROM 0 to 1
      acks: all
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
        compression.type: snappy
        # ✅ Add these for fast failure
        retry.backoff.ms: 100
        delivery.timeout.ms: 5000
        request.timeout.ms: 5000

    consumer:
      group-id: "category-query-consumer-group"
      key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      value-deserializer: "io.confluent.kafka.serializers.KafkaAvroDeserializer"
      auto-offset-reset: earliest
      enable-auto-commit: true
      properties:
        specific.avro.reader: "true"

# Messaging Queues
messaging-queues:
  kafka:
    topics:
      categories:
        name: categories-topic
        partitions: 3  # ✅ Consider more partitions for scalability
        replicas: 1
      products:
        name: products-topic
        partitions: 3
        replicas: 1

# ✅ Kafka Producer Timeout
kafka:
  producer:
    timeout-seconds: 10

# ----- Retry configuration -----
retry:
  kafka:
    max-attempts: 3
    initial-interval: 2000  # 2 seconds
    multiplier: 2.0
    max-interval: 10000  # 10 seconds max
  # Exception handler retry-after values
  exception:
    event-publish-retry-after: 30  # Retry after 30 seconds for event publish failures
    exhausted-retry-after: 60      # Retry after 60 seconds for exhausted retries


# ----- Server Configs -----
server:
  port: 7070
  servlet:
    context-path: /ecommerce/api/v1

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ---- Zipkin and Tracing Configs ----
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # ⚠️ Use 0.1 in production
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  # ✅ Add metrics export
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

# ----- Eureka Discovery Client -----
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# --- Logging ---
logging:
  level:
    root: INFO
    com.youssef.gamal.ecommerce: DEBUG  # ✅ Your package
    org.springframework.kafka: INFO
    org.springframework.retry: DEBUG  # ✅ See retry attempts
    org.springframework.cache: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.mongodb.driver.protocol.command: DEBUG